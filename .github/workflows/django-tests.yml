name: Backend tests

on:
  push:
    branches: [ "tests" ]
  pull_request:
    branches: [ "tests" ]

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    services:
      db:
        image: postgres:13.10
        env:
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_password
          POSTGRES_DB: django_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Display Python version
      run: python -c "import sys; print(sys.version)"
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8==7.3.0 flake8-isort==6.1.2
        pip install -r ./backend/requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        python -m flake8 backend/ --count --show-source --statistics
    - name: Run Tests
      env:
        POSTGRES_USER: django_user
        POSTGRES_PASSWORD: django_password
        POSTGRES_DB: django_db
        DB_HOST: localhost
        DB_PORT: 5432
        CSRF_TRUSTED: "http://localhost,http://127.0.0.1"
      run: |
        cd backend
        python manage.py migrate
        pytest
        # python manage.py test
  send_message:
    runs-on: ubuntu-latest
    needs:
      - test
    if: always()
    steps:
      - name: Build status message
        id: build_msg
        run: |
          #!/bin/bash
          set -euo pipefail

          repo="${GITHUB_REPOSITORY}"
          run_url="https://github.com/${repo}/actions/runs/${GITHUB_RUN_ID}"

          append() { printf "%s\n" "$1" >> /tmp/msg.txt; }

          append "Репозиторий: ${repo}"
          append "${{ github.actor }} сделал коммит ${{ github.event.commits[0].message }}"
          append "Процесс: ${GITHUB_WORKFLOW}"
          append "Запущен: ${run_url}"
          append ""
          append "Результаты:"
          append "- Test: ${{ needs.test.result }}"
          append ""

          # Build list of failed jobs (job-level)
          failed=""
          if [[ "${{ needs.test.result }}" != "success" ]]; then failed="${failed} backend"; fi

          if [[ -n "$failed" ]]; then
            append "Ошибка на шаге: ${failed}"
            append ""
            append "Полный лог: ${run_url}"
          else
            append "Все шаги выполнены успешно."
          fi

          # expose message to next step
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/msg.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: send message to telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.HOMEWORK_BOT_TOKEN }}
          message: ${{ steps.build_msg.outputs.message }}
